<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtiliWeb</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛠️ UtiliWeb</h1>
    <p>Herramientas útiles y gratuitas</p>
</header>

<main>

    <div class="tools">

        <button class="tool-card" onclick="openTool('calculator')">
            🧮
            <span>Calculadora</span>
        </button>

        <button class="tool-card" onclick="openTool('percentage')">
            📊
            <span>Porcentajes</span>
        </button>

        <button class="tool-card" onclick="openTool('age')">
            🎂
            <span>Calculadora de edad</span>
        </button>

        <button class="tool-card" onclick="openTool('bmi')">
            ⚖️
            <span>Calculadora de IMC</span>
        </button>

        <button class="tool-card" onclick="openTool('temperature')">
            🌡️
            <span>Temperatura</span>
        </button>

        <button class="tool-card" onclick="openTool('length')">
            📏
            <span>Longitud</span>
        </button>

        <button class="tool-card" onclick="openTool('weight')">
            ⚖️
            <span>Peso</span>
        </button>

        <button class="tool-card" onclick="openTool('date')">
            📅
            <span>Días entre fechas</span>
        </button>

        <button class="tool-card" onclick="openTool('text')">
            📝
            <span>Contador de texto</span>
        </button>

        <button class="tool-card" onclick="openTool('password')">
            🔐
            <span>Contraseñas</span>
        </button>

        <button class="tool-card" onclick="openTool('random')">
            🎲
            <span>Número aleatorio</span>
        </button>

        <button class="tool-card" onclick="openTool('stopwatch')">
            ⏱️
            <span>Cronómetro</span>
        </button>

        <button class="tool-card" onclick="openTool('timer')">
            ⏰
            <span>Temporizador</span>
        </button>

    </div>

</main>

<div id="modal" class="modal hidden">

    <div class="modal-box">

        <button class="close-btn" onclick="closeTool()">×</button>

        <div id="modalContent"></div>

    </div>

</div>

<script src="./script.js"></script>

</body>
</html>
